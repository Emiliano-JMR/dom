<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!--h1#mainTitle.text-center{Encabezado} si se agrega *3 hara 3-->
    <h1 id="mainTitle" class="text-center">Encabezado</h1>
    <form>
        <label for="nameIpt">Nombre:</label>
        <input id="nameIpt" type="text">
        
    </form>

    <h2 id="greeting"></h2>

    <div id="feedbackAlert" class="alert alert-danger" role="alert" style="display: none;">
        Necesitas un nombre valido para ingresar!
    </div>

    <!--Segundo formulario-->
    <form>
        <label for="mailIpt">Correo:</label>
        <input id="mailIpt" type="text">
        
    </form>

    <h2 id="greetingMail"></h2>

    <div id="feedbackAlertMail" class="alert alert-danger" role="alert" style="display: none;">
        Necesitas un formato valido ejemplo: luis@gmail.com!
    </div>

    <!--Tercer formulario-->
    <form>
        <label for="ageIpt">Edad:</label>
        <input id="ageIpt" type="text">
        
    </form>

    <h2 id="greetingAge"></h2>

    <div id="feedbackAlertAge" class="alert alert-danger" role="alert" style="display: none;">
        Necesitas una edad valida!
    </div>
    <button id="clearBtn" type="submit" class="btn">Clear</button>
    <button id="sendBtn" type="button" class="btn btn-info">Send</button>

    <script src="./JavaScript/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
